<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS Serverless Contact Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #232F3E, #FF9900);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #232F3E;
            text-align: center;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #232F3E;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #FF9900;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e68600;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width:600px) {

            .container {
                padding: 25px;
            }

        }
    </style>

</head>

<body>

<div class="container">

    <h1>📨 Contact Us</h1>

    <p class="subtitle">
        AWS Serverless Contact Form Demo
    </p>

    <form id="contactForm">

        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            autocomplete="name"
            placeholder="Enter your full name"
            required>

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            autocomplete="email"
            placeholder="Enter your email address"
            required>

        <label for="subject">Subject</label>

        <input
            type="text"
            id="subject"
            autocomplete="off"
            placeholder="Enter subject"
            required>

        <label for="message">Message</label>

        <textarea
            id="message"
            autocomplete="off"
            placeholder="Type your message here..."
            required></textarea>

        <button
            id="sendBtn"
            type="submit">

            Send Message

        </button>

    </form>

    <p id="status"></p>

    <div class="footer">

        Built using AWS S3 • CloudFront • API Gateway • Lambda • SES

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
