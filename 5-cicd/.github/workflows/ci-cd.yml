name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        cd 5-cicd
        pip install -r requirements.txt

    - name: Lint Code
      run: |
        cd 5-cicd
        flake8 .

    - name: Run Tests
      run: |
        cd 5-cicd
        pytest

    # 🔥 EC2 Deployment Step
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd /home/ubuntu/5-cicd
          git pull
          pip3 install -r requirements.txt
          pkill -f app.py || true
          nohup python3 app.py > output.log 2>&1 &
