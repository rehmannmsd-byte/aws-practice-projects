<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Learning Lab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #232F3E, #146EB4);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        h2 {
            color: #FF9900;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.7;
            margin-bottom: 25px;
        }

        button {
            background: #FF9900;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e67e00;
            transform: scale(1.05);
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #7CFC00;
        }

        footer {
            margin-top: 35px;
            font-size: 14px;
            color: #ddd;
        }

        .services {
            margin: 25px 0;
        }

        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>☁ AWS Learning Lab</h1>

    <h2>Welcome to My Static Website</h2>

    <p>
        This website is hosted on Amazon S3 as part of my AWS learning journey.
        My goal is to learn cloud architecture by building real-world projects.
    </p>

    <div class="services">
        <span class="badge">Amazon S3</span>
        <span class="badge">CloudFront</span>
        <span class="badge">Route 53</span>
        <span class="badge">IAM</span>
    </div>

    <button onclick="showMessage()">
        Click Me
    </button>

    <div id="message"></div>

    <footer>
        Built for AWS Practice 🚀
    </footer>

</div>

<script>
function showMessage() {
    document.getElementById("message").innerHTML =
        "🎉 Congratulations! Your static website is working correctly.";
}
</script>

</body>
</html>
