apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-demo-cluster
  region: ap-south-1
  version: "1.36"

managedNodeGroups:
  - name: eks-demo-nodes
    instanceType: t3.small

    desiredCapacity: 2
    minSize: 2
    maxSize: 3

    volumeSize: 20
    volumeType: gp3

    iam:
      withAddonPolicies:
        autoScaler: true
